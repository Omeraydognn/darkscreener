[package]
name = "dark-tee-core"
version = "0.1.0"
edition = "2021"
description = "Dark Pool DEX - TEE icinde calisan kriptografi ve batch clearing cekirdegi"

[dependencies]
k256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
ruint = "1"
thiserror = "2"
zeroize = "1"
tlock_age = "0.0.10"
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"

[dev-dependencies]
hex = "0.4"
