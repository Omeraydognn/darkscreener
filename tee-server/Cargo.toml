[package]
name = "dark-tee-server"
version = "0.1.0"
edition = "2021"
description = "Dark Pool DEX - enclave HTTP sunucusu (cekirdek + TEE wrapper birlestirici)"

[dependencies]
dark-tee-core = { path = "../tee-core" }
dark-tee-attest = { path = "../tee-attest" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha3 = "0.10"
# dev-client
k256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
